<svg xmlns='http://www.w3.org/2000/svg' width='360' height='760' viewBox='0 0 360 760'>
<rect width='360' height='760' rx='28' fill='#fff' stroke='#333' stroke-width='3'/>
<text x='24' y='26' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888'>12:00</text>
<text x='336' y='26' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' text-anchor='end'>▲ ✱ ▮</text>
<line x1='0' y1='88' x2='360' y2='88' stroke='#bbb'/>
<text x='56' y='70' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#333'>Help: Compass</text>
<text x='20' y='70' font-family='Helvetica, Arial, sans-serif' font-size='22' fill='#333'>←</text>
<text x='16' y='120' font-family='Helvetica, Arial, sans-serif' font-size='18' fill='#333' font-weight='bold' text-anchor='start'>Compass</text>
<text x='16' y='146' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>The outer ring turns so N, E, S and W always point</text>
<text x='16' y='168' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>the real way; the arrow points at the place. Hold the</text>
<text x='16' y='190' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>phone flat. If it asks for calibration, move it in a</text>
<text x='16' y='212' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>figure-8.</text>
<text x='16' y='250' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>Below the compass: the distance, and the uncertainty</text>
<text x='16' y='272' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>radius, which combines your GPS accuracy and the</text>
<text x='16' y='294' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>place’s. The satellite line shows how many are used.</text>
<text x='16' y='332' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>Close to the place, the middle becomes a map: you at</text>
<text x='16' y='354' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#333' font-weight='normal' text-anchor='start'>the centre, the shaded search circle, and scale rings…</text>
<rect x='16' y='400' width='328' height='44' rx='10' fill='none' stroke='#555' stroke-width='2'/>
<text x='180.0' y='427.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#555' font-weight='bold' text-anchor='middle'>How to use FindIt (all topics)</text>
<text x='16' y='470' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>Without a topic (“How to use FindIt”): Getting started, then</text>
<text x='16' y='484' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>every screen’s topic in order.</text>
</svg>
