<svg xmlns='http://www.w3.org/2000/svg' width='360' height='760' viewBox='0 0 360 760'>
<rect width='360' height='760' rx='28' fill='#fff' stroke='#333' stroke-width='3'/>
<text x='24' y='26' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888'>12:00</text>
<text x='336' y='26' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' text-anchor='end'>▲ ✱ ▮</text>
<line x1='0' y1='88' x2='360' y2='88' stroke='#bbb'/>
<text x='56' y='70' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#333'>Sharing history</text>
<text x='20' y='70' font-family='Helvetica, Arial, sans-serif' font-size='22' fill='#333'>←</text>
<text x='340' y='71' font-family='Helvetica, Arial, sans-serif' font-size='20' fill='#555' text-anchor='end'>⚙</text>
<text x='16' y='116' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#888' font-weight='normal' text-anchor='start'>Kept for 90 days · change this in Settings.</text>
<text x='16' y='154' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#333' font-weight='bold' text-anchor='start'>Alex</text>
<text x='16' y='174' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#888' font-weight='normal' text-anchor='start'>3 places · 2026-10-28</text>
<line x1='16' y1='188' x2='344' y2='188' stroke='#bbb'/>
<text x='16' y='212' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#333' font-weight='bold' text-anchor='start'>FindCache user</text>
<text x='16' y='232' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#888' font-weight='normal' text-anchor='start'>1 place · 2026-10-21</text>
<line x1='16' y1='246' x2='344' y2='246' stroke='#bbb'/>
<text x='16' y='270' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#333' font-weight='bold' text-anchor='start'>Sam's Pixel</text>
<text x='16' y='290' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#888' font-weight='normal' text-anchor='start'>4 places · 2026-10-02</text>
<line x1='16' y1='304' x2='344' y2='304' stroke='#bbb'/>
<text x='16' y='330' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>One row each time someone downloads my places, recorded when</text>
<text x='16' y='344' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>they disconnect (connecting without downloading isn’t recorded).</text>
<text x='16' y='358' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>Older FindCache versions send no name: shown as “FindCache user”.</text>
<text x='16' y='380' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>Entries older than the Settings retention are deleted when this or the</text>
<text x='16' y='394' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>Share screen opens. Forever keeps everything.</text>
<rect x='16' y='696' width='328' height='44' rx='10' fill='none' stroke='#555' stroke-width='2'/>
<text x='180.0' y='723.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#555' font-weight='bold' text-anchor='middle'>Clear history</text>
<text x='16' y='684' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>Asks “Clear sharing history?” first.</text>
