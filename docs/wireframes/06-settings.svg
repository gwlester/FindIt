<svg xmlns='http://www.w3.org/2000/svg' width='360' height='760' viewBox='0 0 360 760'>
<rect width='360' height='760' rx='28' fill='#fff' stroke='#333' stroke-width='3'/>
<text x='24' y='26' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888'>12:00</text>
<text x='336' y='26' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' text-anchor='end'>▲ ✱ ▮</text>
<line x1='0' y1='88' x2='360' y2='88' stroke='#bbb'/>
<text x='56' y='70' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#333'>Settings</text>
<text x='20' y='70' font-family='Helvetica, Arial, sans-serif' font-size='22' fill='#333'>←</text>
<text x='16' y='116' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='bold' text-anchor='start'>Your name for sharing</text>
<rect x='16' y='122' width='328' height='40' rx='8' fill='#fff' stroke='#bbb' stroke-width='1.5'/>
<text x='28' y='147.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#333' font-weight='normal' text-anchor='start'>Gerald</text>
<text x='16' y='178' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#888' font-weight='normal' text-anchor='start'>Nearby users see the first dozen or so characters.</text>
<rect x='16' y='204' width='328' height='128' rx='12' fill='#f2f2f2' stroke='#bbb' stroke-width='1.5'/>
<text x='30' y='230' font-family='Helvetica, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold' text-anchor='start'>Distance units</text>
<rect x='30' y='244' width='22' height='22' rx='5' fill='#555' stroke='#555' stroke-width='2'/>
<path d='M35 255 l5 5 l8 -10' stroke='#fff' stroke-width='2.5' fill='none'/>
<text x='64' y='255' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#333' font-weight='normal' text-anchor='start'>Metric</text>
<text x='64' y='271' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='normal' text-anchor='start'>metres / kilometres</text>
<rect x='30' y='290' width='22' height='22' rx='5' fill='none' stroke='#555' stroke-width='2'/>
<text x='64' y='301' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#333' font-weight='normal' text-anchor='start'>Imperial</text>
<text x='64' y='317' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='normal' text-anchor='start'>feet / miles</text>
<rect x='16' y='346' width='328' height='112' rx='12' fill='#f2f2f2' stroke='#bbb' stroke-width='1.5'/>
<text x='30' y='372' font-family='Helvetica, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold' text-anchor='start'>GPS</text>
<rect x='30' y='386' width='22' height='22' rx='5' fill='#555' stroke='#555' stroke-width='2'/>
<path d='M35 397 l5 5 l8 -10' stroke='#fff' stroke-width='2.5' fill='none'/>
<text x='64' y='397' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#333' font-weight='normal' text-anchor='start'>High-accuracy GPS</text>
<text x='64' y='413' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='normal' text-anchor='start'>Keep tracking every satellite while finding</text>
<text x='64' y='429' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='normal' text-anchor='start'>or averaging a place (Android 12+). More battery.</text>
<rect x='16' y='470' width='328' height='150' rx='12' fill='#f2f2f2' stroke='#bbb' stroke-width='1.5'/>
<text x='30' y='496' font-family='Helvetica, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold' text-anchor='start'>Search area</text>
<rect x='30' y='508' width='22' height='22' rx='5' fill='none' stroke='#555' stroke-width='2'/>
<text x='64' y='519' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#333' font-weight='normal' text-anchor='start'>Always show the arrow</text>
<text x='64' y='535' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='normal' text-anchor='start'>Otherwise, close to the cache the compass</text>
<text x='64' y='551' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='normal' text-anchor='start'>shows a map of the search area.</text>
<text x='30' y='576' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#888' font-weight='bold' text-anchor='start'>Show the search area within</text>
<circle cx='66' cy='600' r='16' fill='none' stroke='#555' stroke-width='2'/>
<text x='66' y='607' font-family='Helvetica, Arial, sans-serif' font-size='20' fill='#555' font-weight='bold' text-anchor='middle'>−</text>
<circle cx='252' cy='600' r='16' fill='none' stroke='#555' stroke-width='2'/>
<text x='252' y='607' font-family='Helvetica, Arial, sans-serif' font-size='20' fill='#555' font-weight='bold' text-anchor='middle'>+</text>
<text x='156' y='607' font-family='Helvetica, Arial, sans-serif' font-size='18' fill='#333' font-weight='bold' text-anchor='middle'>50 m</text>
<rect x='16' y='634' width='328' height='44' rx='10' fill='#555' stroke='#555' stroke-width='2'/>
<text x='180.0' y='661.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#fff' font-weight='bold' text-anchor='middle'>Save</text>
<text x='16' y='700' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>Stored in metres; shown in the current units, rounded to</text>
<text x='16' y='714' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b04a00' font-weight='normal' text-anchor='start'>5 m / 10 ft (50 m ↔ 160 ft). Stored in SQLite (settings).</text>
</svg>
