name: Build Android

on:
  # The workflow starts for every pull request and master push (no path filter), so the
  # required `build` check always reports. The `changes` job decides whether the app is
  # affected; if not, `build` is skipped, which counts as passing. A master build that
  # changes the app is published as a release (see the release job).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the build in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: source

jobs:
  # Does this change affect the app? (source/, this workflow, the Gradle signing script.)
  # Pull requests are checked out as their merge with the base branch, so HEAD^ is the base.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            app=true
          else
            app=$(.github/scripts/app-changed.sh)
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "App affected: $app"

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write # coverage comment
      id-token: write # Codecov upload without a stored token (OIDC)
    env:
      CI: 1
      IS_MASTER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the parent commit, to see what a master push changed

      # master: release only when the app or this workflow changed (docs-only merges don't
      # build at all; the `changes` job skips them). Running the workflow by hand on master always releases.
      - name: Decide whether this build is a release
        id: release
        if: env.IS_MASTER == 'true'
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
             [ "$(.github/scripts/app-changed.sh)" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed: building and testing, but not releasing."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies. Only the default branch writes to the cache
      # (other branches read it), and stale entries are removed after every run.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails if any source file drops below 90% statement/branch/function/line coverage.
      - name: Unit tests (90% coverage per file)
        shell: bash
        run: npm run test:coverage 2>&1 | tee test-output.log

      # Coverage table on the run's summary page; written even when tests fail so a
      # shortfall is visible. Also saved for the pull request comment below.
      - name: Coverage summary
        if: always() && hashFiles('source/coverage/coverage-summary.json') != ''
        run: >
          node scripts/coverage-report.js coverage/coverage-summary.json
          --root "$PWD" --title "Test coverage"
          --footer "Commit ${GITHUB_SHA::7} · [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          --append "$GITHUB_STEP_SUMMARY" > coverage-report.md

      # Coverage history, badge and pull request checks on codecov.io. Uses GitHub's OIDC
      # identity, so no secret is stored; never fails the build (e.g. before Codecov is set up).
      - name: Upload coverage to Codecov
        if: always() && hashFiles('source/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: source/coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      # master: the browsable HTML coverage report, published to GitHub Pages by the
      # coverage-site job. Kept for one day only; Pages serves its own copy.
      - name: Package HTML coverage report for GitHub Pages
        if: env.IS_MASTER == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/coverage/lcov-report
          retention-days: 1

      # Pull requests from this repo (forks get a read-only token): post the report as a PR
      # comment, updating the same comment on later pushes instead of adding new ones.
      - name: Coverage comment on the pull request
        if: >
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('source/coverage-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GH_REPO/issues/$pr/comments" \
            --jq '.[] | select(.body | startswith("<!-- findit-coverage -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@coverage-report.md > /dev/null
          else
            gh pr comment "$pr" --body-file coverage-report.md
          fi

      # Surface the end of the test output (failures, coverage shortfalls) as an annotation,
      # so it can be read from the run summary and the API without downloading logs.
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.log ] || exit 0
          summary=$(grep -E '●|✕|threshold|Tests:|Test Suites:' test-output.log | tail -60)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\n'/'%0A'}
          echo "::error title=Unit tests failed::${summary}"

      # Release builds (master) get a date-based version YYYY.MM.DD.NNN (UTC), where NNN
      # counts that day's releases. versionCode is YYMMDDNNN so every release installs
      # over the previous one. Other branches keep the version in app.json.
      - name: Set release version
        id: version
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%Y.%m.%d)
          last=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$today." --jq '.[].ref' |
            sed -n "s|^refs/tags/$today\.\([0-9]\{3\}\)$|\1|p" | sort | tail -1)
          seq=$(printf '%03d' $((10#${last:-000} + 1)))
          version="$today.$seq"
          code="$(date -u +%y%m%d)$seq"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          VERSION="$version" VERSION_CODE="$code" node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '
          echo "Version $version (versionCode $code)"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Release build, signed with the debug key from the Expo template, so it can
      # be sideloaded. arm64-v8a only: covers current phones and keeps the build fast.
      - name: Build APK
        working-directory: source/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: findcache-${{ github.sha }}
          path: source/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          # A hand-off to the release job (the Release then holds the real file) and a way to
          # test a pull request's build. The 7-day default here once kept every build's APK for a
          # week; one day is enough and keeps Actions storage small.
          retention-days: 1
          compression-level: 0 # APKs are already compressed

      # Release builds only; skipped until the upload keystore secrets exist (ANDROID_RELEASE_KEYSTORE_BASE64,
      # ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_KEY_PASSWORD): a
      # Play-ready AAB signed with the upload key. The sideload APK above keeps the debug key so
      # existing installs can still update over it.
      - name: Build signed AAB
        id: aab
        if: steps.release.outputs.release == 'true'
        working-directory: source/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No upload keystore secrets; skipping the signed AAB."
            exit 0
          fi
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$UPLOAD_KEYSTORE_FILE"
          ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a \
            -I "$GITHUB_WORKSPACE/.github/gradle/release-signing.init.gradle"
          rm -f "$UPLOAD_KEYSTORE_FILE"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload AAB
        if: steps.aab.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: findcache-aab-${{ github.sha }}
          path: source/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          # The only copy of the Play upload, so it outlives the APK artifact, but not for long.
          retention-days: 3
          compression-level: 0

  # Publishes the HTML coverage report of each master build to GitHub Pages
  # (https://gwlester.github.io/FindIt/). Requires Settings → Pages → Source: GitHub Actions.
  coverage-site:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Publishes each successful master build as a GitHub Release tagged with its
  # date-based version. The asset is always named findcache.apk so
  # https://github.com/<repo>/releases/latest/download/findcache.apk works.
  # Only the two newest releases are kept: older ones (and their tags) are deleted
  # right after publishing. Release files don't count toward Actions storage.
  release:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write # to delete this run's hand-off artifact once the Release holds the file
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: findcache-${{ github.sha }}
          path: apk

      - name: Publish release
        run: |
          cp apk/*.apk findcache.apk
          gh release create "$VERSION" findcache.apk --target "$GITHUB_SHA" \
            --title "FindCache $VERSION" --generate-notes --latest

      # Best-effort, and only after "Publish release" succeeded: the APK is now safe in the
      # Release, so its artifact (a hand-off to this job) is deleted instead of waiting out its
      # retention. A failure here never fails the release.
      - name: Delete this run's APK artifact
        run: |
          id=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"findcache-$GITHUB_SHA\") | .id" 2>/dev/null) || id=""
          [ -z "$id" ] || gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" ||
            echo "::warning::Could not delete artifact $id (it will still expire after its retention period)"

      - name: Delete older releases (keep the newest 2)
        run: |
          gh release list --limit 1000 --json tagName \
            --jq '[.[] | .tagName | select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]{3}$"))]
                  | sort | reverse | .[2:] | .[]' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
