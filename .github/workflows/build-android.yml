name: Build Android

on:
  # Every branch in this repo builds on push (PRs from this repo are covered by
  # that); pull_request is only for PRs from forks. Pushing a version tag (v1.2.3)
  # builds and publishes a GitHub Release (path filters don't apply to tags).
  push:
    branches: ['**']
    tags: ['v*.*.*']
    paths: ['source/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['source/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

# A newer push to the same branch/PR cancels the build in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: source

jobs:
  build:
    # Skip the duplicate pull_request run for PRs whose branch is in this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies. Only the default branch writes to the cache
      # (other branches read it), and stale entries are removed after every run.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # For a release tag, stamp the version into the app: versionName from the tag,
      # versionCode from the run number so each release installs over the previous one.
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION.replace(/^v/, "");
            app.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("version", app.expo.version, "versionCode", app.expo.android.versionCode);
          '

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Release build, signed with the debug key from the Expo template, so it can
      # be sideloaded. arm64-v8a only: covers current phones and keeps the build fast.
      - name: Build APK
        working-directory: source/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: findit-${{ github.sha }}
          path: source/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # APKs are already compressed

  # For a version tag, publish the APK as a GitHub Release. The asset is always named
  # findit.apk so https://github.com/<repo>/releases/latest/download/findit.apk works.
  # Release files don't count toward Actions storage.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: findit-${{ github.sha }}
          path: apk

      - name: Publish release
        run: |
          cp apk/*.apk findit.apk
          # The release may already exist if it was drafted in the GitHub UI.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" findit.apk --clobber
          else
            gh release create "$TAG" findit.apk --verify-tag --title "FindIt $TAG" --generate-notes
          fi
