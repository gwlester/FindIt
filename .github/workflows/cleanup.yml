name: Clean up

# Keeps the repository and Actions storage tidy:
#  - deletes a PR's caches as soon as the PR is closed,
#  - deletes a PR's branch (and its caches) as soon as the PR is merged,
#  - deletes a branch's caches when the branch is deleted,
#  - weekly: deletes artifacts older than 7 days, caches for branches that no
#    longer exist, workflow runs (with their logs) older than 30 days, and stale
#    branches (tip belongs to a merged PR, no open PR) that were missed.
# (Old releases are deleted by the release job in build-android.yml.)

on:
  pull_request:
    types: [closed]
  delete:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.ref || 'scheduled' }}

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  pr-caches:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches for the closed PR
        run: |
          ref="refs/pull/${{ github.event.pull_request.number }}/merge"
          gh cache list --ref "$ref" --limit 1000 --json id --jq '.[].id' |
            while read -r id; do gh cache delete "$id"; done

  # Branches deleted with the workflow token don't trigger other workflows, so this
  # also removes the branch's caches instead of relying on the `delete` event.
  merged-branch:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete the merged branch and its caches
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" 2> err.txt; then
            echo "Deleted branch $BRANCH"
          elif grep -q "Reference does not exist" err.txt; then
            echo "Branch $BRANCH was already deleted"
          else
            cat err.txt; exit 1
          fi
          gh cache list --ref "refs/heads/$BRANCH" --limit 1000 --json id --jq '.[].id' |
            while read -r id; do gh cache delete "$id"; done

  branch-caches:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches for the deleted branch
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          gh cache list --ref "refs/heads/$BRANCH" --limit 1000 --json id --jq '.[].id' |
            while read -r id; do gh cache delete "$id"; done

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write # deleting stale branches
    steps:
      - name: Delete stale branches (merged, no open pull request)
        run: |
          default=$(gh api "repos/$GH_REPO" --jq .default_branch)
          gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[] | "\(.name) \(.commit.sha)"' |
            while read -r branch sha; do
              [ "$branch" = "$default" ] && continue
              merged=$(gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '[.[] | select(.merged_at != null)] | length')
              open=$(gh api "repos/$GH_REPO/pulls?state=open&head=${GH_REPO%%/*}:$branch" --jq 'length')
              if [ "$merged" -gt 0 ] && [ "$open" -eq 0 ]; then
                gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" && echo "Deleted stale branch $branch"
              fi
            done

      - name: Delete artifacts older than 7 days
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$cutoff\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"; done

      - name: Delete caches for branches that no longer exist
        run: |
          branches=$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')
          gh cache list --limit 1000 --json id,ref --jq '.[] | "\(.id) \(.ref)"' |
            while read -r id ref; do
              case "$ref" in
                refs/heads/*)
                  if ! grep -qxF "${ref#refs/heads/}" <<<"$branches"; then gh cache delete "$id"; fi ;;
                refs/pull/*)
                  pr=$(cut -d/ -f3 <<<"$ref")
                  state=$(gh pr view "$pr" --json state --jq .state 2>/dev/null || echo CLOSED)
                  if [ "$state" != "OPEN" ]; then gh cache delete "$id"; fi ;;
              esac
            done

      - name: Delete workflow runs older than 30 days
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100&created=<$cutoff" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/runs/$id"; done

