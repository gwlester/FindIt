name: Build Android

on:
  # Every branch in this repo builds on push (PRs from this repo are covered by
  # that); pull_request is only for PRs from forks. Each successful build of
  # master is published as a release (see the release job).
  push:
    paths: ['source/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['source/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

# A newer push to the same branch/PR cancels the build in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: source

jobs:
  build:
    # Skip the duplicate pull_request run for PRs whose branch is in this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies. Only the default branch writes to the cache
      # (other branches read it), and stale entries are removed after every run.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails if any source file drops below 90% statement/branch/function/line coverage.
      - name: Unit tests (90% coverage per file)
        shell: bash
        run: npm run test:coverage 2>&1 | tee test-output.log

      # Surface the end of the test output (failures, coverage shortfalls) as an annotation,
      # so it can be read from the run summary and the API without downloading logs.
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.log ] || exit 0
          summary=$(grep -E '●|✕|threshold|Tests:|Test Suites:' test-output.log | tail -60)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\n'/'%0A'}
          echo "::error title=Unit tests failed::${summary}"

      # Release builds (master) get a date-based version YYYY.MM.DD.NNN (UTC), where NNN
      # counts that day's releases. versionCode is YYMMDDNNN so every release installs
      # over the previous one. Other branches keep the version in app.json.
      - name: Set release version
        id: version
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%Y.%m.%d)
          last=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$today." --jq '.[].ref' |
            sed -n "s|^refs/tags/$today\.\([0-9]\{3\}\)$|\1|p" | sort | tail -1)
          seq=$(printf '%03d' $((10#${last:-000} + 1)))
          version="$today.$seq"
          code="$(date -u +%y%m%d)$seq"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          VERSION="$version" VERSION_CODE="$code" node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '
          echo "Version $version (versionCode $code)"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Release build, signed with the debug key from the Expo template, so it can
      # be sideloaded. arm64-v8a only: covers current phones and keeps the build fast.
      - name: Build APK
        working-directory: source/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: findit-${{ github.sha }}
          path: source/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # APKs are already compressed

  # Publishes each successful master build as a GitHub Release tagged with its
  # date-based version. The asset is always named findit.apk so
  # https://github.com/<repo>/releases/latest/download/findit.apk works.
  # Only the two newest releases are kept: older ones (and their tags) are deleted
  # right after publishing. Release files don't count toward Actions storage.
  release:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: findit-${{ github.sha }}
          path: apk

      - name: Publish release
        run: |
          cp apk/*.apk findit.apk
          gh release create "$VERSION" findit.apk --target "$GITHUB_SHA" \
            --title "FindIt $VERSION" --generate-notes --latest

      - name: Delete older releases (keep the newest 2)
        run: |
          gh release list --limit 1000 --json tagName \
            --jq '[.[] | .tagName | select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]{3}$"))]
                  | sort | reverse | .[2:] | .[]' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
